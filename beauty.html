<style>
  html{font-size:18px}  /* 13 英寸笔记本观看优化：根字号 16→18 */

  /* ============================================================
     Beauty 子页面 · 完全自包含（不依赖任何本地 CSS）
     ============================================================ */
  :root{
    --paper:#F1F0EA;--ink:#1C1B18;
    --yellow:#F5D915;--magenta:#C9316E;--navy:#1F4E9C;
    --teal:#7FC9E8;--lime:#B9D93B;--coral:#F0907E;--sky:#A8DCE8;
    --pink:#F2A6C4;
    --muted:#8b897f;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth;overflow-x:clip}
  body{
    font-family:"Noto Sans SC",sans-serif;
    background:var(--paper);color:var(--ink);
    overflow-x:hidden;position:relative;min-height:100vh;
  }
  a{color:inherit}

  /* ============ 品牌区与目录入口 ============ */
  .brand{
    position:absolute;top:2.6rem;left:max(2rem, calc(50vw - 468px));z-index:10;
    font-weight:700;font-size:1.6rem;letter-spacing:.22em;
    text-decoration:none;color:var(--ink);
  }
  .menu{
    position:absolute;top:2.4rem;right:3rem;z-index:11;
    width:4.2rem;height:4.2rem;border-radius:50%;
    background:#fff;cursor:pointer;
    display:flex;flex-direction:column;gap:.5rem;
    align-items:center;justify-content:center;
    box-shadow:0 2px 14px rgba(28,27,24,.08);
    transition:transform .25s ease;text-decoration:none;
  }
  .menu:hover{transform:scale(1.08)}
  .menu span{display:block;width:1.5rem;height:2px;background:var(--ink);border-radius:2px}

  /* ============ 有机色块 ============ */
  .blob{
    position:absolute;z-index:0;
    mix-blend-mode:multiply;
    background-color:var(--c);
    animation:drift var(--d,14s) ease-in-out var(--dl,0s) infinite alternate;
    will-change:transform;pointer-events:none;
  }
  .blob.dotted{
    background-image:radial-gradient(var(--dot) 2.1px, transparent 2.5px);
    background-size:11px 11px;
  }
  @keyframes drift{
    0%  {transform:rotate(var(--r,0deg)) translate(0,0) scale(1)}
    50% {transform:rotate(calc(var(--r,0deg) + 4deg)) translate(1.2%, -2%) scale(1.04)}
    100%{transform:rotate(calc(var(--r,0deg) - 3deg)) translate(-1.5%, 1.5%) scale(.97)}
  }

  /* ============ 标题区 ============ */
  .page{
    position:relative;z-index:2;
    max-width:1000px;margin:0 auto;
    padding:9rem 2rem 0;
  }
  .crumb{display:inline-flex;align-items:center;gap:.4rem;font-size:.9rem;letter-spacing:.18em;font-weight:700;color:#fff;text-decoration:none;background:var(--ink);padding:.7rem 1.6rem;border-radius:999px;border:2.5px solid var(--ink);box-shadow:5px 5px 0 var(--accent,var(--magenta));transition:transform .25s ease,box-shadow .25s ease,color .2s}
    .crumb:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--accent,var(--magenta));color:var(--accent,var(--magenta))}
  .hero-h{margin-top:2rem}
  .hero-h .label{font-size:.85rem;letter-spacing:.3em;color:var(--muted)}
  .hero-h h1{
    font-family:"Playfair Display",serif;
    font-style:italic;font-weight:500;
    font-size:clamp(3rem,6vw,5rem);line-height:1.05;
    margin-top:.8rem;
  }
  .hero-h .zh{
    margin-top:1rem;font-size:clamp(1rem,1.6vw,1.15rem);
    letter-spacing:.14em;font-weight:500;
  }

  /* ============ 照片横幅：单向无限滚动 ============
     换真图：把每个 .shot 里的占位数字换成
     <img loading="lazy" src="women1.jpg" alt="">
     （竖版图建议比例 2:3，宽度随意，会自动裁齐） */
  .strip{
    position:relative;z-index:2;
    margin-top:3.5rem;
    overflow:hidden;
    cursor:grab;                 /* 提示可以拖 */
    touch-action:pan-y;          /* 横向拖拽交给脚本，纵向仍然能滚动页面 */
    user-select:none;
    -webkit-user-select:none;
  }
  .strip.dragging{cursor:grabbing}
  .strip-track{
    display:flex;gap:1.6rem;
    width:max-content;
    padding-right:1.6rem;   /* 让首尾衔接处也有间距 */
    will-change:transform;
  }
  .strip img{
    pointer-events:none;    /* 防止拖拽时触发浏览器原生图片拖动 */
    -webkit-user-drag:none;
    user-select:none;
  }
  .strip .shot{cursor:zoom-in}   /* 提示单击可放大 */

  /* ============ 点击放大（灯箱） ============ */
  .lightbox{
    position:fixed;inset:0;z-index:99;
    display:flex;align-items:center;justify-content:center;
    padding:4.5rem 5.5rem;
    background:rgba(28,27,24,.92);
    opacity:0;pointer-events:none;
    transition:opacity .3s ease;
  }
  .lightbox.open{opacity:1;pointer-events:auto}
  .lightbox img{
    max-width:100%;max-height:100%;
    width:auto;height:auto;object-fit:contain;
    border-radius:14px;
    box-shadow:0 30px 80px rgba(0,0,0,.5);
    transform:scale(.94);
    transition:transform .3s ease;
  }
  .lightbox.open img{transform:scale(1)}
  .lb-btn{
    position:absolute;border:none;cursor:pointer;
    background:#fff;color:var(--ink);
    width:3.4rem;height:3.4rem;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:1.25rem;font-family:inherit;line-height:1;
    box-shadow:0 6px 20px rgba(0,0,0,.28);
    transition:transform .2s ease;
  }
  .lb-btn:hover{transform:scale(1.1)}
  .lb-close{top:1.8rem;right:1.8rem;font-size:1.4rem}
  .lb-prev{left:2rem;top:50%;margin-top:-1.7rem;font-size:1.7rem}
  .lb-next{right:2rem;top:50%;margin-top:-1.7rem;font-size:1.7rem}
  .lb-count{
    position:absolute;bottom:1.5rem;left:50%;transform:translateX(-50%);
    color:rgba(255,255,255,.72);font-size:.8rem;letter-spacing:.25em;
    font-family:"Playfair Display",serif;font-style:italic;
  }
  .shot{
    width:min(420px, 62vw);
    aspect-ratio:2/3;          /* 竖版 */
    border-radius:18px;overflow:hidden;flex:none;
    box-shadow:0 6px 24px rgba(28,27,24,.08);
    display:flex;align-items:center;justify-content:center;
    font-family:"Playfair Display",serif;font-style:italic;
    font-size:1.4rem;color:rgba(28,27,24,.55);
  }
  .shot img{width:100%;height:100%;object-fit:cover;display:block}
  .s1{background:var(--coral);background-image:radial-gradient(rgba(255,255,255,.7) 1.8px,transparent 2.2px);background-size:10px 10px}
  .s2{background:var(--teal);background-image:radial-gradient(var(--navy) 1.8px,transparent 2.2px);background-size:10px 10px}
  .s3{background:var(--yellow);background-image:radial-gradient(var(--magenta) 1.8px,transparent 2.2px);background-size:10px 10px}
  .s4{background:var(--magenta);background-image:radial-gradient(rgba(255,255,255,.75) 1.8px,transparent 2.2px);background-size:10px 10px}
  .s5{background:var(--lime);background-image:radial-gradient(rgba(255,255,255,.7) 1.8px,transparent 2.2px);background-size:10px 10px}
  .s6{background:var(--sky);background-image:radial-gradient(var(--navy) 1.8px,transparent 2.2px);background-size:10px 10px}

  /* ============ 引文 ============ */
  .quote{
    max-width:44rem;margin:4rem auto 0;
    padding:0 2rem;
    text-align:center;
  }
  .quote p{
    font-family:"Playfair Display",serif;font-style:italic;
    font-size:1.35rem;line-height:1.7;
  }
  .quote .src{margin-top:.9rem;font-size:.8rem;letter-spacing:.2em;color:var(--muted)}

  /* ============ 回退 / 前进 ============ */
  .pager{
    position:relative;z-index:2;
    max-width:1000px;margin:4rem auto 0;padding:0 2rem;
    display:flex;justify-content:space-between;gap:1.2rem;flex-wrap:wrap;
  }
  .pager a{display:inline-flex;flex-direction:column;gap:.35rem;padding:1.1rem 2.1rem;border-radius:999px;background:var(--ink);border:2.5px solid var(--ink);box-shadow:6px 6px 0 var(--accent,var(--magenta));text-decoration:none;transition:transform .25s ease,box-shadow .25s ease}

    .pager a:hover .pname{color:var(--accent,var(--magenta))}
    .pager .dir{font-size:.85rem;letter-spacing:.28em;color:rgba(255,255,255,.95);font-weight:700}
    .pager .pname{font-family:"Playfair Display",serif;font-style:italic;font-weight:600;font-size:1.4rem;color:#fff;transition:color .2s}
  .pager .next{align-items:flex-end;text-align:right}

  .outro{
    position:relative;z-index:2;overflow:hidden;
    margin-top:5rem;min-height:54vh;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    text-align:center;padding:6rem 2rem 7rem;

    background:#fff;display:flex;align-items:center;justify-content:center;
    text-decoration:none;font-size:1.3rem;color:var(--ink);
    box-shadow:0 2px 14px rgba(28,27,24,.08);
    transition:transform .25s ease;
  }
  .outro .top:hover{transform:translateY(-6px)}
  .ob1{--c:var(--yellow);--dot:var(--magenta);--r:-10deg;--d:17s;
      width:30vw;height:24vw;bottom:-14vw;left:-8vw;

  .ob2{--c:var(--teal);--dot:var(--navy);--r:14deg;--d:15s;

  .ob3{--c:var(--navy);--r:-20deg;--d:14s;

  .ob4{--c:var(--lime);--r:8deg;--d:18s;

  /* ============ 底部粉色曲线（横向贯穿） ============ */
  .swoosh{
    position:relative;z-index:2;overflow:hidden;
    margin-top:-2rem;line-height:0;pointer-events:none;
  }
  .swoosh svg{display:block;width:100%;height:clamp(96px,9.5vw,158px)}
  .swoosh path{
    fill:none;stroke-linecap:round;stroke-linejoin:round;
    vector-effect:non-scaling-stroke;
  }
  .sw-line{stroke:var(--pink);stroke-width:clamp(18px,2.3vw,36px)}
  .sw-thin{stroke:var(--magenta);stroke-width:clamp(3px,.32vw,5px);opacity:.5}

  /* ============ 页脚 ============ */
  .site-footer{
    position:relative;z-index:2;
    padding:2.5rem;text-align:center;
    color:var(--muted);font-size:.85rem;letter-spacing:.08em;

  /* ============ 响应式 ============ */

    .brand{left:2rem;top:1.6rem}

    .lb-next{right:.6rem}
    .lb-btn{width:2.9rem;height:2.9rem}
  }

<script>
  /* ============================================================
     照片横幅：自动滚动 + 手动拖拽 + 无限循环
     原理：轨道由两组完全相同的照片组成（共 40 张，实为 20 张 ×2）。
           位移走到「半条轨道」的宽度时，画面与起点完全一致，
           所以把位移取模减掉这一半，接缝处看不出跳变。
     ============================================================ */
  (function () {
    const strip = document.querySelector('.strip');
    const track = document.querySelector('.strip-track');
    if (!strip || !track) return;

    const SPEED = 38;      // 自动滚动速度：像素/秒（向左为负）
    const MAX_V = 2200;    // 拖拽甩出的最大速度，防止飞太快
    let half = track.scrollWidth / 2;   // 半条轨道宽度 = 一组照片的宽度
    let x = 0;             // 当前位移
    let v = -SPEED;        // 当前速度
    let dragging = false, startX = 0, startOffset = 0, lastX = 0, lastT = 0;

    // 位移取模：始终落在 (-half, 0] 区间，保证无缝循环
    function wrap(n) {
      if (!half) return n;
      n = n % half;
      return n > 0 ? n - half : n;
    }
    function render() {
      track.style.transform = 'translate3d(' + x + 'px,0,0)';
    }

    // 窗口变化时重新测量（照片宽度是响应式的）
    window.addEventListener('resize', function () {
      half = track.scrollWidth / 2;
      render();
    });

    track.querySelectorAll('img').forEach(function (img) {
      img.setAttribute('draggable', 'false');
    });

    strip.addEventListener('pointerdown', function (e) {
      dragging = true;
      strip.classList.add('dragging');
      strip.setPointerCapture(e.pointerId);
      startX = e.clientX;
      startOffset = x;
      lastX = e.clientX;
      lastT = performance.now();
      v = 0;
    });

    strip.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      x = wrap(startOffset + (e.clientX - startX));
      const now = performance.now();
      const dt = now - lastT;
      if (dt > 16) {                     // 采样拖动速度，松手后当作惯性
        v = Math.max(-MAX_V, Math.min(MAX_V, (e.clientX - lastX) / dt * 1000));
        lastX = e.clientX;
        lastT = now;
      }
      render();
    });

    function endDrag() {
      if (!dragging) return;
      dragging = false;
      strip.classList.remove('dragging');
    }
    strip.addEventListener('pointerup', endDrag);
    strip.addEventListener('pointercancel', endDrag);

    let last = performance.now();
    requestAnimationFrame(function tick(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      if (!dragging) {
        // 速度平滑收敛回自动滚动速度：松手的惯性会自然衰减，然后接着向左滚
        v += (-SPEED - v) * Math.min(1, dt * 2.2);
        x += v * dt;
      }
      x = wrap(x);
      render();
      requestAnimationFrame(tick);
    });
  })();
</script>

<script>
  /* ============================================================
     单击放大查看：点一下照片弹灯箱，可用 ‹ › / 键盘 ← → 翻看，
     点空白处、✕ 或 Esc 关闭。拖动超过 8px 视为拖拽，不会误触。
     ============================================================ */
  (function () {
    const strip = document.querySelector('.strip');
    const track = document.querySelector('.strip-track');
    const lb = document.getElementById('lightbox');
    const lbImg = document.getElementById('lbImg');
    const lbCount = document.getElementById('lbCount');
    if (!strip || !track || !lb) return;

    // 只取第一组 20 张，作为灯箱的图库
    const all = Array.from(track.querySelectorAll('.shot'));
    const srcs = all.slice(0, 20).map(s => s.querySelector('img').getAttribute('src'));
    let cur = 0, downShot = null, downX = 0, downY = 0, downT = 0;

    strip.addEventListener('pointerdown', function (e) {
      downShot = e.target.closest('.shot');
      downX = e.clientX;
      downY = e.clientY;
      downT = performance.now();
    });

    strip.addEventListener('pointerup', function (e) {
      const shot = downShot;      // 按下时命中的照片（拖拽时事件目标会变成 strip，所以提前记住）
      downShot = null;
      if (!shot) return;
      const moved = Math.hypot(e.clientX - downX, e.clientY - downY);
      const held = performance.now() - downT;
      if (moved > 8 || held > 600) return;   // 拖拽 / 长按，不放大
      open(all.indexOf(shot) % srcs.length);
    });

    function open(i) {
      cur = ((i % srcs.length) + srcs.length) % srcs.length;
      lbImg.src = srcs[cur];
      lbCount.textContent = (cur + 1) + ' / ' + srcs.length;
      lb.classList.add('open');
      lb.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }
    function close() {
      lb.classList.remove('open');
      lb.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }
    function step(d) { open(cur + d); }

    document.getElementById('lbClose').addEventListener('click', close);
    document.getElementById('lbPrev').addEventListener('click', function (e) { e.stopPropagation(); step(-1); });
    document.getElementById('lbNext').addEventListener('click', function (e) { e.stopPropagation(); step(1); });
    lb.addEventListener('click', function (e) { if (e.target === lb) close(); });
    document.addEventListener('keydown', function (e) {
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape') close();
      if (e.key === 'ArrowLeft') step(-1);
      if (e.key === 'ArrowRight') step(1);
    });
  })();
</script>

  } else {
    play(Math.floor(Math.random() * SONGS.length));
  }
  /* 离开页面（点链接去别的页面）前保存状态，供下一页续播；移动端 pagehide 不可靠，补 visibilitychange */
  window.addEventListener('pagehide', function(){ saveState(true); });
  document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'hidden') saveState(true); });
  /* 前进/后退从往返缓存（bfcache）恢复时：内存状态还在，直接续播，不重新加载 */
  window.addEventListener('pageshow', function(e){
    if (e.persisted && cur >= 0 && audio.paused){
      var p = audio.play();
      if (p && p.catch) p.catch(function(){});
    }
  });
})();
</script>

</body>
</html>
