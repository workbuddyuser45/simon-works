      e.preventDefault();
      e.stopPropagation();
      try { window.parent.postMessage({ mpNav: u.pathname + u.search + u.hash }, '*'); } catch (err) {}
    }, true);
    try { window.parent.postMessage({ mpLoaded: true, url: location.pathname, title: document.title }, '*'); } catch (err) {}
    return;
  }
  var SONGS=[
    {no:"01",title:"無眠之惘",file:"01.ogg"},

  ];
  var audio = document.getElementById('mpAudio'),
      fab = document.getElementById('mpFab'),
      panel = document.getElementById('mpPanel'),
      elTitle = document.getElementById('mpTitle'),
      elNo = document.getElementById('mpNo'),
      elBar = document.getElementById('mpBar'),
      elFill = document.getElementById('mpFill'),
      elCur = document.getElementById('mpCur'),
      elDur = document.getElementById('mpDur'),
      bPlay = document.getElementById('mpPlay'),
      bPrev = document.getElementById('mpPrev'),
      bNext = document.getElementById('mpNext'),
      bListBtn = document.getElementById('mpListBtn'),
      elList = document.getElementById('mpList');
  var cur = -1, wantPlay = false, pending = false, pendingSeek = -1, lastSave = 0;
  var hintEl = document.getElementById('mpHint');
  audio.volume = 0.55;  /* 不太响也不太轻 */
  function showHint(){ hintEl.style.display = 'block'; }
  function hideHint(){ hintEl.style.display = 'none'; }
  /* 跨页记忆：切页前把曲号/进度/是否在播存进 sessionStorage，新页面无缝接上 */
  function saveState(force){
    if (cur < 0) return;
    var now = Date.now();
    if (!force && now - lastSave < 1000) return;
    lastSave = now;
    try {
      sessionStorage.setItem('mpState', JSON.stringify({ cur: cur, t: audio.currentTime || 0, playing: !audio.paused }));
    } catch (err) {}
  }

  var items = [];
  SONGS.forEach(function(s, i){
    var b = document.createElement('button');
    var n = document.createElement('span'); n.className = 'n'; n.textContent = s.no;
    var t = document.createElement('span'); t.textContent = s.title;
    b.appendChild(n); b.appendChild(t);
    b.addEventListener('click', function(){ play(i); });
    elList.appendChild(b);
    items.push(b);
  });

  function fmt(t){
    if (!isFinite(t)) return '--:--';
    t = Math.round(t);
    return Math.floor(t/60) + ':' + ('0'+(t%60)).slice(-2);
  }
  function markCur(){
    items.forEach(function(b, i){ b.classList.toggle('cur', i === cur); });
    if (cur >= 0){
      var li = items[cur];
      if (li.scrollIntoView) li.scrollIntoView({block:'nearest'});
    }
  }
  function play(i, seekTo){
    cur = ((i % SONGS.length) + SONGS.length) % SONGS.length;
    wantPlay = true;
    pending = false;
    pendingSeek = (seekTo && seekTo > 0) ? seekTo : -1;
    hideHint();
    audio.src = 'music/' + SONGS[cur].file;
    var p = audio.play();
    if (p) p.catch(function(){
      /* 进站自动播放被浏览器拦截：曲子已选好，等访客任意一次点击/按键立刻响起 */
      pending = true;
      showHint();
      armGesture();
    });
    elTitle.textContent = SONGS[cur].title;
    elNo.textContent = 'TRACK ' + SONGS[cur].no + ' / ' + SONGS.length;
    elFill.style.width = '0%';
    elCur.textContent = '0:00';
    elDur.textContent = '--:--';
    markCur();
  }
  function randomPlay(){
    var r;
    do { r = Math.floor(Math.random() * SONGS.length); } while (r === cur && SONGS.length > 1);
    play(r);
  }
  function toggle(){
    pending = false;
    hideHint();
    if (audio.paused){
      if (cur < 0) { randomPlay(); }        /* 第一次点播放：随机 */
      else { audio.play().catch(function(){}); }
    } else {
      audio.pause();
    }
  }
  bPlay.addEventListener('click', toggle);
  bPrev.addEventListener('click', function(){ play(cur < 0 ? 0 : cur - 1); });
  bNext.addEventListener('click', function(){ play(cur < 0 ? 0 : cur + 1); });
  audio.addEventListener('play', function(){
    bPlay.textContent = '⏸';
    fab.classList.add('on');
  });
  audio.addEventListener('pause', function(){
    bPlay.textContent = '▶';
    fab.classList.remove('on');
  });
  audio.addEventListener('ended', function(){ saveState(true); play(cur + 1); });   /* 播完顺序接下一首 */
  audio.addEventListener('timeupdate', function(){
    if (audio.duration){
      elFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
      elCur.textContent = fmt(audio.currentTime);
      saveState(false);
    }
  });
  audio.addEventListener('loadedmetadata', function(){
    if (audio.duration === Infinity){
      /* Ogg/Opus 在部分浏览器拿不到总时长：先跳到结尾骗出真实时长再回到应到的位置 */
      audio.currentTime = 1e7;
      var restore = function(){
        audio.removeEventListener('timeupdate', restore);
        if (pendingSeek >= 0){
          audio.currentTime = Math.min(pendingSeek, Math.max(0, audio.duration - 1));
          pendingSeek = -1;
        } else {
          audio.currentTime = 0;
        }
        elDur.textContent = fmt(audio.duration);
      };
      audio.addEventListener('timeupdate', restore);
    } else {
      if (pendingSeek >= 0){
        audio.currentTime = Math.min(pendingSeek, Math.max(0, audio.duration - 1));
        pendingSeek = -1;
      }
      elDur.textContent = fmt(audio.duration);
    }
  });
  /* 进度条：点击跳转 + 按住拖动 */
  var dragging = false;
  function seekFromEvent(e){
    if (!audio.duration || audio.duration === Infinity) return;
    var r = elBar.getBoundingClientRect();
    var x = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
    var ratio = Math.min(1, Math.max(0, (x - r.left) / r.width));
    try { audio.currentTime = ratio * audio.duration; } catch (err) {}
    elFill.style.width = (ratio * 100) + '%';
    elCur.textContent = fmt(ratio * audio.duration);
  }
  elBar.addEventListener('pointerdown', function(e){
    if (!audio.duration || audio.duration === Infinity) return;
    dragging = true;
    try { elBar.setPointerCapture(e.pointerId); } catch (err) {}
    seekFromEvent(e);
  });
  elBar.addEventListener('pointermove', function(e){ if (dragging) seekFromEvent(e); });
  elBar.addEventListener('pointerup', function(){ dragging = false; });
  elBar.addEventListener('pointercancel', function(){ dragging = false; });
  bListBtn.addEventListener('click', function(){
    var open = elList.classList.toggle('open');
    bListBtn.classList.toggle('on', open);
    markCur();
  });
  fab.addEventListener('click', function(){
    panel.classList.toggle('open');
    if (panel.classList.contains('open')) markCur();
  });
  /* 点面板外面收起面板 */
  document.addEventListener('click', function(e){
    if (!panel.classList.contains('open')) return;
    if (panel.contains(e.target) || fab.contains(e.target)) return;
    panel.classList.remove('open');
    elList.classList.remove('open');
    bListBtn.classList.remove('on');
  });
  function tryStart(){
    if (!audio.paused || cur < 0) return true;
    var p = audio.play();
    if (p && p.catch){
      p.catch(function(){
        /* 这次仍被拦截：重新挂起等下一次交互（循环直到成功或用户手动操作） */
        pending = true;
        showHint();
        armGesture();
      });
      return false;
    }
    return true;
  }
  function armGesture(){
    ['pointerdown', 'touchstart', 'keydown'].forEach(function(ev){
      document.addEventListener(ev, function go(){
        document.removeEventListener(ev, go);
        if (!pending) return;
        pending = false;
        hideHint();
        tryStart();
      }, { passive: true });
    });
  }
  hintEl.addEventListener('click', function(){
    pending = false;
    hideHint();
    tryStart();
  });
  /* 进站：有跨页记忆就无缝续播（换页前在播的曲子接着响、接着进度）；没有记忆则随机选曲开播 */
  var saved = null;
  try { saved = JSON.parse(sessionStorage.getItem('mpState') || 'null'); } catch (err) {}
  if (saved && typeof saved.cur === 'number' && saved.cur >= 0 && saved.cur < SONGS.length){
    if (saved.playing){
      hintEl.textContent = '点一下，继续放歌 ♪';
      play(saved.cur, saved.t);
    } else {
      /* 上次切页时是暂停状态：恢复曲子和进度到面板，不自动出声 */
      cur = saved.cur;
      elTitle.textContent = SONGS[cur].title;
      elNo.textContent = 'TRACK ' + SONGS[cur].no + ' / ' + SONGS.length;
      markCur();
      audio.src = 'music/' + SONGS[cur].file;
      pendingSeek = (saved.t && saved.t > 0) ? saved.t : -1;
      elFill.style.width = '0%'; elCur.textContent = '0:00'; elDur.textContent = '--:--';
    }
  } else {
    play(Math.floor(Math.random() * SONGS.length));
  }
  /* 离开页面（点链接去别的页面）前保存状态，供下一页续播；移动端 pagehide 不可靠，补 visibilitychange */
  window.addEventListener('pagehide', function(){ saveState(true); });
  document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'hidden') saveState(true); });
  /* 前进/后退从往返缓存（bfcache）恢复时：内存状态还在，直接续播，不重新加载 */
  window.addEventListener('pageshow', function(e){
    if (e.persisted && cur >= 0 && audio.paused){
      var p = audio.play();
      if (p && p.catch) p.catch(function(){});
    }
  });
})();
